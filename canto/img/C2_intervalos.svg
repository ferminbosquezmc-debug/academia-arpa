<rect x="1915.0" y="189.6" width="130.0" height="54.4" rx="27.2" fill="#E5312B" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1980.0" y="232.2" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">DO↑</text>
<path d="M 1780 730 Q 1820 500.0 1940 240" fill="none" stroke="#8E3BB8" stroke-width="8" stroke-linecap="round"/>
