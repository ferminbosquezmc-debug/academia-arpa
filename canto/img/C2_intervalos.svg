<rect x="395.0" y="489.6" width="130.0" height="54.4" rx="27.2" fill="#FFD21F" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="460.0" y="532.2" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">MI</text>
<path d="M 260 730 Q 300 650.0 420 540" fill="none" stroke="#2E9E4F" stroke-width="8" stroke-linecap="round"/>
<text x="360.0" y="940.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#1A1A1A" text-anchor="middle">«Mi voz» (clase 12): «Ca-da dí-a…»</text>
<rect x="820.0" y="220.0" width="600.0" height="640.0" rx="22" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<text x="1120.0" y="290.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#2370D6" text-anchor="middle">5.ª justa</text>
<rect x="955.0" y="749.6" width="130.0" height="54.4" rx="27.2" fill="#E5312B" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1020.0" y="792.2" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">DO</text>
<rect x="1155.0" y="329.6" width="130.0" height="54.4" rx="27.2" fill="#2AA7E8" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1220.0" y="372.2" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">SOL</text>
<path d="M 1020 730 Q 1060 570.0 1180 380" fill="none" stroke="#2370D6" stroke-width="8" stroke-linecap="round"/>
<text x="1120.0" y="940.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#1A1A1A" text-anchor="middle">«Estrellita»: «Bri-lla, bri-lla…»</text>
<rect x="1580.0" y="220.0" width="600.0" height="640.0" rx="22" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<text x="1880.0" y="290.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#8E3BB8" text-anchor="middle">8.ª justa</text>
<rect x="1715.0" y="749.6" width="130.0" height="54.4" rx="27.2" fill="#E5312B" stroke="#1A1A1A" stroke-width="2.5"/>
