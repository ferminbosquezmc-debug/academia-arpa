<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1050" viewBox="0 0 2400 1050" role="img" aria-label="Intervalos con melodías de referencia">
<title>Intervalos con melodías de referencia</title>
<rect width="2400" height="1050" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">3.ª, 5.ª y 8.ª: las recuerdo con canciones</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Si recuerdo cómo empieza una canción, recuerdo el intervalo</text>
<rect x="60.0" y="220.0" width="600.0" height="640.0" rx="22" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<text x="360.0" y="290.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#2E9E4F" text-anchor="middle">3.ª mayor</text>
<rect x="195.0" y="749.6" width="130.0" height="54.4" rx="27.2" fill="#E5312B" stroke="#1A1A1A" stroke-width="2.5"/>
