<circle cx="370.0" cy="470.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="370.0" y="480.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">5</text>
<circle cx="610.0" cy="330.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="610.0" y="340.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">6</text>
<circle cx="400.0" cy="400.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="400.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">7</text>
<circle cx="980.0" cy="290.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="300.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">1</text>
<text x="1030.0" y="300.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Pies separados al ancho de los hombros, el peso repartido</text>
<circle cx="980.0" cy="400.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">2</text>
<text x="1030.0" y="410.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Rodillas sueltas, nunca trabadas</text>
<circle cx="980.0" cy="510.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="520.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">3</text>
<text x="1030.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Cadera derecha, sin sacar la panza ni la cola</text>
<circle cx="980.0" cy="620.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="630.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">4</text>
<text x="1030.0" y="630.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Costillas abiertas: el aire baja a la cintura (línea azul)</text>
<circle cx="980.0" cy="730.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="740.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">5</text>
<text x="1030.0" y="740.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Hombros abajo y relajados, brazos sueltos</text>
<circle cx="980.0" cy="840.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="850.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">6</text>
<text x="1030.0" y="850.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Cabeza derecha, mirada al frente, mentón paralelo al suelo</text>
<circle cx="980.0" cy="950.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="980.0" y="960.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">7</text>
<text x="1030.0" y="960.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" text-anchor="start">Cuello y mandíbula libres, sin tensión</text>
<text x="1200.0" y="1130.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#8A6A0A" text-anchor="middle">Sentado: en el borde de la silla, espalda recta y los dos pies en el suelo</text>
</svg>
