<line x1="520.0" y1="720.0" x2="430.0" y2="1000.0" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" />
<line x1="520.0" y1="720.0" x2="610.0" y2="1000.0" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" />
<line x1="380.0" y1="1010.0" x2="480.0" y2="1010.0" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" />
