<text x="370.0" y="1020.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">1</text>
<circle cx="640.0" cy="860.0" r="26.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
