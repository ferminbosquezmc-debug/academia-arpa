<title>Postura para cantar en siete pasos</title>
<rect width="2400" height="1200" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Mi postura para cantar · 7 pasos</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">De pie, como un árbol: raíces en el suelo y la copa libre</text>
<circle cx="520.0" cy="330.0" r="70.0" fill="#FDE7C8" stroke="#1A1A1A" stroke-width="4"/>
<line x1="520.0" y1="400.0" x2="520.0" y2="720.0" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" />
