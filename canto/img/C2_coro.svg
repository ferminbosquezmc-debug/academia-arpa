<text x="1200.0" y="820.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#8A6A0A" text-anchor="middle">La voz baja canta DO – DO – SI – DO: casi no se mueve, y por eso suena unida</text>
