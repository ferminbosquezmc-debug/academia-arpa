<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000" role="img" aria-label="Cómo cantar con micrófono">
<title>Cómo cantar con micrófono</title>
<rect width="2400" height="1000" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Cantar con micrófono</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Distancia, ángulo y movimiento · distancias aproximadas, el técnico de sonido ajusta el resto</text>
<circle cx="240.0" cy="420.0" r="70.0" fill="#FDE7C8" stroke="#1A1A1A" stroke-width="3"/>
<path d="M 290 440 q 18 8 0 22" fill="none" stroke="#1A1A1A" stroke-width="4"/>
<rect x="430.0" y="410.0" width="170.0" height="40.0" rx="18" fill="#5F6368" stroke="#1A1A1A" stroke-width="2"/>
<circle cx="430.0" cy="430.0" r="30.0" fill="#9AA0A6" stroke="#1A1A1A" stroke-width="2"/>
<line x1="315.0" y1="490.0" x2="430.0" y2="490.0" stroke="#2E9E4F" stroke-width="4" stroke-linecap="round" />
<text x="378.5" y="530.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#2E9E4F" text-anchor="middle">↔</text>
<text x="420.0" y="620.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#2E9E4F" text-anchor="middle">Normal</text>
<text x="420.0" y="670.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">a unos 3 a 5 cm, frente a la boca</text>
<circle cx="1000.0" cy="420.0" r="70.0" fill="#FDE7C8" stroke="#1A1A1A" stroke-width="3"/>
<path d="M 1050 440 q 18 8 0 22" fill="none" stroke="#1A1A1A" stroke-width="4"/>
<rect x="1370.0" y="410.0" width="170.0" height="40.0" rx="18" fill="#5F6368" stroke="#1A1A1A" stroke-width="2"/>
<circle cx="1370.0" cy="430.0" r="30.0" fill="#9AA0A6" stroke="#1A1A1A" stroke-width="2"/>
<line x1="1075.0" y1="490.0" x2="1370.0" y2="490.0" stroke="#F57C00" stroke-width="4" stroke-linecap="round" />
<text x="1228.5" y="530.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#F57C00" text-anchor="middle">↔</text>
<text x="1180.0" y="620.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#F57C00" text-anchor="middle">Notas fuertes o agudas</text>
<text x="1180.0" y="670.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">me alejo un poco: 10 a 15 cm</text>
<circle cx="1760.0" cy="420.0" r="70.0" fill="#FDE7C8" stroke="#1A1A1A" stroke-width="3"/>
<path d="M 1810 440 q 18 8 0 22" fill="none" stroke="#1A1A1A" stroke-width="4"/>
<rect x="1860.0" y="410.0" width="170.0" height="40.0" rx="18" fill="#5F6368" stroke="#1A1A1A" stroke-width="2"/>
<circle cx="1860.0" cy="430.0" r="30.0" fill="#9AA0A6" stroke="#1A1A1A" stroke-width="2"/>
<line x1="1835.0" y1="490.0" x2="1860.0" y2="490.0" stroke="#E5312B" stroke-width="4" stroke-linecap="round" />
<text x="1853.5" y="530.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#E5312B" text-anchor="middle">↔</text>
<text x="1940.0" y="620.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#E5312B" text-anchor="middle">Muy cerca</text>
<text x="1940.0" y="670.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">sonido grave y «pegado»: lo evito</text>
<rect x="120.0" y="760.0" width="2160.0" height="190.0" rx="20" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<text x="170.0" y="820.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• Apunto el micrófono a la boca, no al pecho ni a la nariz</text>
<text x="170.0" y="870.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• Lo tomo del cuerpo, no de la rejilla, y no lo golpeo</text>
<text x="170.0" y="920.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• No apunto el micrófono a los altavoces: produce acople (pitido)</text>
</svg>
