<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="Las cinco vocales cantadas">
<title>Las cinco vocales cantadas</title>
<rect width="2400" height="900" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Las 5 vocales del canto</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Boca abierta y redonda · la mandíbula suelta · la lengua relajada detrás de los dientes de abajo</text>
<ellipse cx="280" cy="420" rx="120" ry="120" fill="#E5312B" opacity=".2" stroke="#E5312B" stroke-width="8"/>
<text x="280.0" y="445.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="700" fill="#E5312B" text-anchor="middle">A</text>
<text x="280.0" y="640.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="middle">boca bien abierta</text>
<ellipse cx="740" cy="420" rx="140" ry="80" fill="#F57C00" opacity=".2" stroke="#F57C00" stroke-width="8"/>
<text x="740.0" y="445.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="700" fill="#F57C00" text-anchor="middle">E</text>
<text x="740.0" y="640.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="middle">sonrisa suave</text>
<ellipse cx="1200" cy="420" rx="140" ry="55" fill="#C9A227" opacity=".2" stroke="#C9A227" stroke-width="8"/>
<text x="1200.0" y="445.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="700" fill="#C9A227" text-anchor="middle">I</text>
<text x="1200.0" y="640.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="middle">sonrisa, sin apretar</text>
<ellipse cx="1660" cy="420" rx="95" ry="115" fill="#2E9E4F" opacity=".2" stroke="#2E9E4F" stroke-width="8"/>
<text x="1660.0" y="445.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="700" fill="#2E9E4F" text-anchor="middle">O</text>
<text x="1660.0" y="640.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="middle">labios redondos</text>
<ellipse cx="2120" cy="420" rx="60" ry="80" fill="#2370D6" opacity=".2" stroke="#2370D6" stroke-width="8"/>
<text x="2120.0" y="445.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="700" fill="#2370D6" text-anchor="middle">U</text>
<text x="2120.0" y="640.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="middle">labios hacia adelante</text>
<text x="1200.0" y="780.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#8A6A0A" text-anchor="middle">Ejercicio: «mi – me – ma – mo – mu» en una nota, cambiando solo la forma de la boca</text>
</svg>
