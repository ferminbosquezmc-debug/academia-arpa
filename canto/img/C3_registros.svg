<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1050" viewBox="0 0 2400 1050" role="img" aria-label="Los registros de la voz">
<title>Los registros de la voz</title>
<rect width="2400" height="1050" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Voz de pecho, voz de cabeza y la zona de paso</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">La meta es una sola voz pareja de abajo hacia arriba, sin «quiebres» ni gritos</text>
<rect x="200.0" y="230.0" width="120.0" height="700.0" rx="20" fill="#EEF0F4" stroke="#1A1A1A" stroke-width="2"/>
<rect x="200.0" y="230.0" width="120.0" height="220.0" rx="16" fill="#2370D6" stroke="#1A1A1A" stroke-width="2"/>
<text x="380.0" y="330.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#2370D6" text-anchor="start">Voz de cabeza</text>
<text x="380.0" y="380.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">notas agudas · se siente vibrar en la cabeza y la cara</text>
<rect x="200.0" y="470.0" width="120.0" height="220.0" rx="16" fill="#F57C00" stroke="#1A1A1A" stroke-width="2"/>
<text x="380.0" y="570.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#F57C00" text-anchor="start">Zona de paso</text>
<text x="380.0" y="620.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">donde la voz quiere «quebrarse» · se canta más liviano</text>
<rect x="200.0" y="710.0" width="120.0" height="220.0" rx="16" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="380.0" y="810.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#E5312B" text-anchor="start">Voz de pecho</text>
<text x="380.0" y="860.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">notas graves y medias · se siente vibrar en el pecho</text>
<text x="260.0" y="210.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#5F6368" text-anchor="middle">agudo</text>
<text x="260.0" y="970.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#5F6368" text-anchor="middle">grave</text>
<rect x="1500.0" y="300.0" width="820.0" height="560.0" rx="22" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<text x="1910.0" y="370.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#8E3BB8" text-anchor="middle">Voz mixta</text>
<text x="1560.0" y="450.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• mezcla de pecho y cabeza</text>
<text x="1560.0" y="512.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• une los registros sin quiebre</text>
<text x="1560.0" y="574.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• ejercicios: sirena con «u»,</text>
<text x="1560.0" y="636.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• labios «brrr» subiendo y bajando,</text>
<text x="1560.0" y="698.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• escalas de 5 notas con «ng-a»</text>
<text x="1560.0" y="760.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A1A" text-anchor="start">• siempre suave, nunca forzado</text>
</svg>
