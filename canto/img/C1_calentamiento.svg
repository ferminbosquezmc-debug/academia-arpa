<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="Calentamiento vocal de cinco minutos">
<title>Calentamiento vocal de cinco minutos</title>
<rect width="2400" height="900" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Mi calentamiento de 5 minutos</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Siempre antes de cantar · suave, sin forzar · en orden</text>
<rect x="80.0" y="230.0" width="420.0" height="440.0" rx="22" fill="#2370D6" stroke="#1A1A1A" stroke-width="2"/>
<text x="290.0" y="310.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 min</text>
<text x="290.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cuerpo</text>
<text x="290.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">estiro el cuello, los</text>
<text x="290.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">hombros y la cara</text>
<rect x="536.0" y="230.0" width="420.0" height="440.0" rx="22" fill="#2E9E4F" stroke="#1A1A1A" stroke-width="2"/>
<text x="746.0" y="310.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 min</text>
<text x="746.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">Respiración</text>
<text x="746.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">inhalo en 4 y</text>
<text x="746.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">exhalo con «sss» en 8</text>
<rect x="992.0" y="230.0" width="420.0" height="440.0" rx="22" fill="#F57C00" stroke="#1A1A1A" stroke-width="2"/>
<text x="1202.0" y="310.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 min</text>
<text x="1202.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">Labios</text>
<text x="1202.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">vibro los labios</text>
<text x="1202.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">«brrr» subiendo y bajando</text>
<rect x="1448.0" y="230.0" width="420.0" height="440.0" rx="22" fill="#8E3BB8" stroke="#1A1A1A" stroke-width="2"/>
<text x="1658.0" y="310.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 min</text>
<text x="1658.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">Resonancia</text>
<text x="1658.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">tarareo con «mmm»</text>
<text x="1658.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">en notas cómodas</text>
<rect x="1904.0" y="230.0" width="420.0" height="440.0" rx="22" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="2114.0" y="310.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 min</text>
<text x="2114.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vocales</text>
<text x="2114.0" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">canto «mi-me-ma-mo-mu»</text>
<text x="2114.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">en DO-RE-MI-RE-DO</text>
<text x="1200.0" y="780.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle">Al terminar de cantar, enfrío: tarareo suave bajando y tomo agua</text>
<text x="1200.0" y="840.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#8A6A0A" text-anchor="middle">Si algo duele, paro</text>
</svg>
