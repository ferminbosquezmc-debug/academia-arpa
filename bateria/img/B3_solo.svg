<text x="1200.0" y="990.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#5F6368" text-anchor="middle" >Consejo: deja silencios y vuelve siempre al 1 con fuerza</text>
