<text x="1630.0" y="910.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle" >(la distancia exacta entre ellos es a gusto: suele ser una 3.ª o 4.ª, aproximadamente)</text>
