<text x="490.0" y="416.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1A" text-anchor="end" >Redoblante</text>
<line x1="520.0" y1="405.0" x2="1720.0" y2="405.0" stroke="#D5D9E0" stroke-width="2" />
<circle cx="670.0" cy="405.0" r="36.0" fill="#E5312B" stroke="#C9A227" stroke-width="6"/>
