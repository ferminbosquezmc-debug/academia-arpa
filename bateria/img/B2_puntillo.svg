<text x="1570.0" y="728.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32.4" font-weight="700" fill="#FFFFFF" text-anchor="middle" >I</text>
<text x="1800.0" y="670.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#8A6A0A" text-anchor="middle" >¾ + ¼ = 1 pulso</text>
<text x="60.0" y="870.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="start" >Shuffle  ·  tresillo sin la nota del medio: «tri – la»  (1 pulso)</text>
