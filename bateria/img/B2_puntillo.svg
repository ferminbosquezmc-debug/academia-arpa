<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250" role="img" aria-label="El puntillo y el shuffle">
<title>El puntillo y el shuffle</title>
<rect width="2400" height="1250" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start" >El puntillo</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start" >El puntillo suma la mitad del valor de la figura · el shuffle «largo-corto» sale del tresillo</text>
<text x="60.0" y="250.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="start" >Negra con puntillo + corchea  ·  «ta-a-ti»  (2 pulsos)</text>
