<text x="1800.0" y="360.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#8A6A0A" text-anchor="middle" >1½ + ½ = 2 pulsos</text>
<text x="60.0" y="560.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="start" >Corchea con puntillo + semicorchea  ·  «taa-ri»  (1 pulso)</text>
