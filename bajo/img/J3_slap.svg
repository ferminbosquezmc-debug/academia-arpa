<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250" role="img" aria-label="Técnica de slap: pulgar y pop">
<title>Técnica de slap: pulgar y pop</title>
<rect width="2400" height="1250" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start" >Slap: pulgar (T) y pop (P)</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start" >T = golpe del pulgar en la cuerda grave · P = el índice engancha y suelta la cuerda aguda</text>
<rect x="100.0" y="230.0" width="720.0" height="330.0" rx="20" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<circle cx="460.0" cy="320.0" r="50.0" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="460.0" y="336.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" >T</text>
<text x="460.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle" >T · pulgar</text>
<text x="460.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >golpeo con el hueso del pulgar</text>
<text x="460.0" y="505.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >al final del mástil y reboto</text>
<rect x="860.0" y="230.0" width="720.0" height="330.0" rx="20" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<circle cx="1220.0" cy="320.0" r="50.0" fill="#2370D6" stroke="#1A1A1A" stroke-width="2"/>
<text x="1220.0" y="336.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" >P</text>
<text x="1220.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle" >P · pop</text>
<text x="1220.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >el índice engancha la cuerda RE o SOL</text>
<text x="1220.0" y="505.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >la jala y la suelta contra los trastes</text>
<rect x="1620.0" y="230.0" width="720.0" height="330.0" rx="20" fill="#EEF0F4" stroke="none" stroke-width="0"/>
<circle cx="1980.0" cy="320.0" r="50.0" fill="#5F6368" stroke="#1A1A1A" stroke-width="2"/>
<text x="1980.0" y="336.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" >x</text>
<text x="1980.0" y="420.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle" >x · nota muerta</text>
<text x="1980.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >la mano izquierda apoya sin pisar</text>
<text x="1980.0" y="505.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >suena un golpe sin nota</text>
<text x="80.0" y="680.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="start" >Ejercicio de octavas en MI: T en la raíz, P en la octava</text>
<text x="260.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1A" text-anchor="middle" >1</text>
<circle cx="260.0" cy="860.0" r="46.0" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="260.0" y="876.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >T</text>
<text x="510.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >e</text>
<text x="760.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >y</text>
<circle cx="760.0" cy="860.0" r="46.0" fill="#2370D6" stroke="#1A1A1A" stroke-width="2"/>
<text x="760.0" y="876.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >P</text>
<text x="1010.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >a</text>
<text x="1260.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1A" text-anchor="middle" >2</text>
<circle cx="1260.0" cy="860.0" r="46.0" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="1260.0" y="876.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >T</text>
<text x="1510.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >e</text>
<circle cx="1510.0" cy="860.0" r="46.0" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="1510.0" y="876.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >T</text>
<text x="1760.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >y</text>
<circle cx="1760.0" cy="860.0" r="46.0" fill="#2370D6" stroke="#1A1A1A" stroke-width="2"/>
<text x="1760.0" y="876.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >P</text>
<text x="2010.0" y="760.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="middle" >a</text>
<text x="1200.0" y="990.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle" >T: cuerda MI al aire · P: cuerda RE, traste 2 (MI una octava arriba)</text>
<text x="1200.0" y="1060.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#8A6A0A" text-anchor="middle" >Empieza lento (60 BPM): el slap se aprende con precisión, no con fuerza</text>
</svg>
