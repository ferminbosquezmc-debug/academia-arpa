<text x="800.0" y="138.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle" >0</text>
<text x="800.0" y="560.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#8A6A0A" text-anchor="middle" >0 = cuerda al aire</text>
<text x="800.0" y="605.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="middle" >en la 1.ª cuerda</text>
<rect x="1220" y="158" width="60" height="64" fill="#FFFFFF"/>
<text x="1250.0" y="208.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle" >1</text>
<text x="1250.0" y="560.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#8A6A0A" text-anchor="middle" >1 = traste 1</text>
<text x="1250.0" y="605.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="middle" >en la 2.ª cuerda</text>
<rect x="1670" y="368" width="60" height="64" fill="#FFFFFF"/>
<text x="1700.0" y="418.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="54" font-weight="700" fill="#1A1A1A" text-anchor="middle" >3</text>
<text x="1700.0" y="560.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#8A6A0A" text-anchor="middle" >3 = traste 3</text>
<text x="1700.0" y="605.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="middle" >en la 5.ª cuerda</text>
<text x="1200.0" y="660.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#1A1A1A" text-anchor="middle" >Cada línea es una cuerda (la de arriba es la 1.ª). El número dice qué traste pisar.</text>
