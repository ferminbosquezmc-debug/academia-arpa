<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="760" viewBox="0 0 2400 760" role="img" aria-label="Cualidades del sonido">
<title>Cualidades del sonido</title>
<rect width="2400" height="760" fill="#FFFFFF"/>
<rect x="40" y="40" width="540" height="680" rx="30" fill="#FAF6EE" stroke="#C9A227" stroke-width="4"/>
<circle cx="310.0" cy="200" r="100" fill="#0E0E10"/>
<text x="310.0" y="230.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="90" font-weight="700" fill="#C9A227" text-anchor="middle" >1</text>
<text x="310.0" y="390.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#1A1A1A" text-anchor="middle" >ALTURA</text>
<text x="310.0" y="470.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#8A6A0A" text-anchor="middle" >agudo ↔ grave</text>
<text x="310.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >1.ª cuerda (aguda)</text>
<text x="310.0" y="610.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >6.ª cuerda (grave)</text>
<rect x="600" y="40" width="540" height="680" rx="30" fill="#FAF6EE" stroke="#C9A227" stroke-width="4"/>
<circle cx="870.0" cy="200" r="100" fill="#0E0E10"/>
<text x="870.0" y="230.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="90" font-weight="700" fill="#C9A227" text-anchor="middle" >2</text>
<text x="870.0" y="390.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#1A1A1A" text-anchor="middle" >DURACIÓN</text>
<text x="870.0" y="470.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#8A6A0A" text-anchor="middle" >largo ↔ corto</text>
<text x="870.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >dejar sonar</text>
<text x="870.0" y="610.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >apagar con la mano</text>
<rect x="1160" y="40" width="540" height="680" rx="30" fill="#FAF6EE" stroke="#C9A227" stroke-width="4"/>
<circle cx="1430.0" cy="200" r="100" fill="#0E0E10"/>
<text x="1430.0" y="230.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="90" font-weight="700" fill="#C9A227" text-anchor="middle" >3</text>
<text x="1430.0" y="390.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#1A1A1A" text-anchor="middle" >INTENSIDAD</text>
<text x="1430.0" y="470.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#8A6A0A" text-anchor="middle" >fuerte ↔ suave</text>
<text x="1430.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >tocar con más o menos fuerza</text>
<rect x="1720" y="40" width="540" height="680" rx="30" fill="#FAF6EE" stroke="#C9A227" stroke-width="4"/>
<circle cx="1990.0" cy="200" r="100" fill="#0E0E10"/>
<text x="1990.0" y="230.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="90" font-weight="700" fill="#C9A227" text-anchor="middle" >4</text>
<text x="1990.0" y="390.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#1A1A1A" text-anchor="middle" >TIMBRE</text>
<text x="1990.0" y="470.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#8A6A0A" text-anchor="middle" >el «color» del sonido</text>
<text x="1990.0" y="560.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >guitarra, piano y voz suenan distinto</text>
</svg>
