<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000" role="img" aria-label="Plan de ensayo de siete días antes de la presentación">
<title>Plan de ensayo de siete días antes de la presentación</title>
<rect width="2400" height="1000" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Mi semana de ensayo</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Siete días antes de la presentación · 30 minutos al día</text>
<rect x="35.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9C3B6" stroke-width="4"/>
<circle cx="190.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="190.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">1</text>
<text x="190.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Divido</text>
<text x="190.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">cada obra en</text>
<text x="190.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">secciones de 4</text>
<text x="190.0" y="550.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">compases</text>
<rect x="375.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9C3B6" stroke-width="4"/>
<circle cx="530.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="530.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">2</text>
<text x="530.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Memorizo</text>
<text x="530.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">sección por</text>
<text x="530.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">sección, lento</text>
<rect x="715.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9C3B6" stroke-width="4"/>
<circle cx="870.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="870.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">3</text>
<text x="870.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Uno</text>
<text x="870.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">las secciones</text>
<text x="870.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">de dos en dos</text>
<rect x="1055.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9C3B6" stroke-width="4"/>
<circle cx="1210.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="1210.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">4</text>
<text x="1210.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Grabo</text>
<text x="1210.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">todo el</text>
<text x="1210.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">programa y me</text>
<text x="1210.0" y="550.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">escucho</text>
<rect x="1395.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9C3B6" stroke-width="4"/>
<circle cx="1550.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="1550.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">5</text>
<text x="1550.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Corrijo</text>
<text x="1550.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">solo las partes</text>
<text x="1550.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">difíciles</text>
<rect x="1735.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FAFAF7" stroke="#C9A227" stroke-width="4"/>
<circle cx="1890.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="1890.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">6</text>
<text x="1890.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ensayo general</text>
<text x="1890.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">de pie, saludo,</text>
<text x="1890.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">afino y toco</text>
<text x="1890.0" y="550.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">todo</text>
<rect x="2075.0" y="220.0" width="310.0" height="520.0" rx="22" fill="#FFF8E1" stroke="#C9A227" stroke-width="4"/>
<circle cx="2230.0" cy="300.0" r="48.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="2230.0" y="318.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">7</text>
<text x="2230.0" y="410.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Descanso</text>
<text x="2230.0" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">repaso suave y</text>
<text x="2230.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">duermo bien</text>
<circle cx="160.0" cy="820.0" r="15.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="195.0" y="830.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="start">Respira lento 4 veces antes de empezar.</text>
<circle cx="160.0" cy="876.0" r="15.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="195.0" y="886.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="start">Si te equivocas, sigue: el público casi nunca lo nota.</text>
<circle cx="160.0" cy="932.0" r="15.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="195.0" y="942.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="start">Mira un punto fijo o a una persona amiga.</text>
</svg>
