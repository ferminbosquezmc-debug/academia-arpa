<text x="195.0" y="710.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="start">Martillo: el dedo cae con fuerza justo detrás del traste, como un martillo pequeño.</text>
<circle cx="160.0" cy="760.0" r="16.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
