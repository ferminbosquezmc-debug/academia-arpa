<circle cx="160.0" cy="820.0" r="16.0" fill="#C9A227" stroke="#1A1A1A" stroke-width="2"/>
<text x="195.0" y="830.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="start">Las dos notas deben sonar parejas: escucha que la segunda no se apague.</text>
