<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="Programa de la presentación final de guitarra">
<title>Programa de la presentación final de guitarra</title>
<rect width="2400" height="900" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Mi presentación final</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Cuatro partes · unos 8 a 10 minutos · Academia de Música ARPA</text>
<rect x="70.0" y="220.0" width="520.0" height="480.0" rx="26" fill="#FAFAF7" stroke="#2AA7E8" stroke-width="6"/>
<circle cx="330.0" cy="320.0" r="56.0" fill="#2AA7E8" stroke="#1A1A1A" stroke-width="2"/>
<text x="330.0" y="342.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="330.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A1A" text-anchor="middle">Escala</text>
<text x="330.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="middle">mayor móvil o pentatónica</text>
<rect x="650.0" y="220.0" width="520.0" height="480.0" rx="26" fill="#FAFAF7" stroke="#2E9E4F" stroke-width="6"/>
<circle cx="910.0" cy="320.0" r="56.0" fill="#2E9E4F" stroke="#1A1A1A" stroke-width="2"/>
<text x="910.0" y="342.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="910.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A1A" text-anchor="middle">Obra</text>
<text x="910.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="middle">Estudio en Do (al estilo de Sor)</text>
<rect x="1230.0" y="220.0" width="520.0" height="480.0" rx="26" fill="#FAFAF7" stroke="#F57C00" stroke-width="6"/>
<circle cx="1490.0" cy="320.0" r="56.0" fill="#F57C00" stroke="#1A1A1A" stroke-width="2"/>
<text x="1490.0" y="342.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1490.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A1A" text-anchor="middle">Canción</text>
<text x="1490.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="middle">acompaño a un cantante o en dúo</text>
<rect x="1810.0" y="220.0" width="520.0" height="480.0" rx="26" fill="#FAFAF7" stroke="#8E3BB8" stroke-width="6"/>
<circle cx="2070.0" cy="320.0" r="56.0" fill="#8E3BB8" stroke="#1A1A1A" stroke-width="2"/>
<text x="2070.0" y="342.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="2070.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A1A" text-anchor="middle">Improvisación</text>
<text x="2070.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="middle">blues en La o Am – F – G – Am</text>
<text x="1200.0" y="800.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="600" fill="#1A1A1A" text-anchor="middle">Entro, saludo, afino, toco, agradezco y salgo: todo es parte de la presentación.</text>
</svg>
