<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1100" viewBox="0 0 2400 1100" role="img" aria-label="Las funciones de los acordes y las cadencias">
<title>Las funciones de los acordes y las cadencias</title>
<rect width="2400" height="1100" fill="#FFFFFF"/>
<text x="40.0" y="72.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">La familia de los acordes</text>
<text x="40.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start">Cada acorde tiene una función: reposo (T), alejamiento (S) o tensión (D)</text>
<rect x="80.0" y="200.0" width="680.0" height="380.0" rx="26" fill="#FAFAF7" stroke="#2E9E4F" stroke-width="6"/>
<circle cx="420.0" cy="285.0" r="52.0" fill="#2E9E4F" stroke="#1A1A1A" stroke-width="2"/>
<text x="420.0" y="305.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">T</text>
<text x="420.0" y="395.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">Tónica · reposo</text>
<text x="420.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#8A6A0A" text-anchor="middle">I · vi · iii</text>
<text x="420.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#5F6368" text-anchor="middle">en Do: C · Am · Em</text>
<rect x="860.0" y="200.0" width="680.0" height="380.0" rx="26" fill="#FAFAF7" stroke="#2AA7E8" stroke-width="6"/>
<circle cx="1200.0" cy="285.0" r="52.0" fill="#2AA7E8" stroke="#1A1A1A" stroke-width="2"/>
<text x="1200.0" y="305.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
<text x="1200.0" y="395.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">Subdominante · alejamiento</text>
<text x="1200.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#8A6A0A" text-anchor="middle">IV · ii</text>
<text x="1200.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#5F6368" text-anchor="middle">en Do: F · Dm</text>
<rect x="1640.0" y="200.0" width="680.0" height="380.0" rx="26" fill="#FAFAF7" stroke="#E5312B" stroke-width="6"/>
<circle cx="1980.0" cy="285.0" r="52.0" fill="#E5312B" stroke="#1A1A1A" stroke-width="2"/>
<text x="1980.0" y="305.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>
<text x="1980.0" y="395.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">Dominante · tensión</text>
<text x="1980.0" y="460.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="700" fill="#8A6A0A" text-anchor="middle">V · V7 · vii°</text>
<text x="1980.0" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#5F6368" text-anchor="middle">en Do: G · G7 · B°</text>
<rect x="50.0" y="680.0" width="540.0" height="340.0" rx="22" fill="#FFF8E1" stroke="#C9A227" stroke-width="3"/>
<text x="320.0" y="750.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cadencia auténtica</text>
<text x="320.0" y="830.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#8A6A0A" text-anchor="middle">V → I</text>
<text x="320.0" y="895.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">G7 → C</text>
<text x="320.0" y="960.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">final fuerte, como un punto</text>
<rect x="640.0" y="680.0" width="540.0" height="340.0" rx="22" fill="#FFF8E1" stroke="#C9A227" stroke-width="3"/>
<text x="910.0" y="750.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cadencia plagal</text>
<text x="910.0" y="830.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#8A6A0A" text-anchor="middle">IV → I</text>
<text x="910.0" y="895.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">F → C</text>
<text x="910.0" y="960.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">final suave, «amén»</text>
<rect x="1230.0" y="680.0" width="540.0" height="340.0" rx="22" fill="#FFF8E1" stroke="#C9A227" stroke-width="3"/>
<text x="1500.0" y="750.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Semicadencia</text>
<text x="1500.0" y="830.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#8A6A0A" text-anchor="middle">… → V</text>
<text x="1500.0" y="895.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">C → G</text>
<text x="1500.0" y="960.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">queda en suspenso, como una coma</text>
<rect x="1820.0" y="680.0" width="540.0" height="340.0" rx="22" fill="#FFF8E1" stroke="#C9A227" stroke-width="3"/>
<text x="2090.0" y="750.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cadencia rota</text>
<text x="2090.0" y="830.0" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="50" font-weight="700" fill="#8A6A0A" text-anchor="middle">V → vi</text>
<text x="2090.0" y="895.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" text-anchor="middle">G7 → Am</text>
<text x="2090.0" y="960.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#5F6368" text-anchor="middle">sorpresa: no llega a casa</text>
</svg>
